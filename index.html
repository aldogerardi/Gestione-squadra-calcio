<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Rosa Squadra</title>
    <meta name="description" content="Gestione anagrafica, allenamenti, partite e report della squadra" />
    <link rel="manifest" href="manifest.json" />
    <link rel="icon" href="icon-192.png" type="image/png" />
    <link rel="apple-touch-icon" href="icon-192.png" />
    <meta name="theme-color" content="#1B4332" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Rosa Squadra" />

    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.24.7/babel.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

    <script type="module">
      // Firebase caricato come modulo ES direttamente dal browser: nessun bundler/npm necessario.
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
      import {
        getFirestore,
        doc,
        setDoc,
        getDoc,
        deleteDoc,
        collection,
        onSnapshot,
      } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
      import {
        getAuth,
        signInWithEmailAndPassword,
        signOut,
        onAuthStateChanged,
      } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

      const firebaseConfig = {
        apiKey: "AIzaSyDNUTTBpTISDS0iHe_3NKyQy8zNTL2ICA8",
        authDomain: "gestione-squadra-838b3.firebaseapp.com",
        projectId: "gestione-squadra-838b3",
        storageBucket: "gestione-squadra-838b3.firebasestorage.app",
        messagingSenderId: "25860570730",
        appId: "1:25860570730:web:0737913899f8f7d4c55413",
      };

      const fbApp = initializeApp(firebaseConfig);
      const db = getFirestore(fbApp);
      const auth = getAuth(fbApp);

      // Esposti su window così il codice React (caricato via Babel, non come modulo) può usarli.
      window.__firebaseDb = db;
      window.__firebaseReady = true;

      const ACCOUNT_STAFF_EMAIL = "staff@rosa-squadra.app";

      // Accesso: l'app entra con l'account staff condiviso usando il codice inserito come password.
      window.fsSignIn = function (codice) {
        return signInWithEmailAndPassword(auth, ACCOUNT_STAFF_EMAIL, codice).then(() => true);
      };
      window.fsSignOut = function () {
        return signOut(auth);
      };
      // fsOnAuthChange: richiama callback(true/false) quando cambia lo stato di accesso
      // (incluso al caricamento, se la sessione era già salva dal browser).
      window.fsOnAuthChange = function (callback) {
        return onAuthStateChanged(auth, (user) => callback(!!user));
      };

      // Test di andata e ritorno: scrive un documento diagnostico e lo rilegge subito.
      window.firebaseTestConnessione = async function () {
        try {
          const ref = doc(db, "_diagnostica", "ping");
          await setDoc(ref, { ultimoTest: new Date().toISOString(), da: "rosa-squadra-app" });
          const snap = await getDoc(ref);
          if (snap.exists()) return { ok: true };
          return { ok: false, errore: "Scrittura riuscita ma lettura vuota" };
        } catch (err) {
          return { ok: false, errore: err && err.message ? err.message : String(err) };
        }
      };

      // Helper generici per sincronizzare una collezione Firestore con lo stato React.
      // fsSubscribeCollection: ascolta i cambiamenti in tempo reale, richiama callback(arrayDiDocumenti) ad ogni variazione.
      window.fsSubscribeCollection = function (nomeCollezione, callback, onError) {
        return onSnapshot(
          collection(db, nomeCollezione),
          (snap) => {
            const arr = snap.docs.map((d) => ({ ...d.data(), id: d.id }));
            callback(arr);
          },
          (err) => {
            console.error("Firestore sync error:", nomeCollezione, err);
            if (onError) onError(err);
          }
        );
      };

      // fsSubscribeDoc: ascolta un singolo documento (per impostazioni condivise, non collezioni intere).
      window.fsSubscribeDoc = function (nomeCollezione, idDoc, callback, onError) {
        return onSnapshot(
          doc(db, nomeCollezione, idDoc),
          (snap) => {
            callback(snap.exists() ? snap.data() : null);
          },
          (err) => {
            console.error("Firestore doc sync error:", nomeCollezione, idDoc, err);
            if (onError) onError(err);
          }
        );
      };

      // fsSaveDoc: crea o aggiorna un documento (sovrascrive interamente con i campi passati).
      window.fsSaveDoc = function (nomeCollezione, id, dati) {
        const senzaId = { ...dati };
        delete senzaId.id;
        return setDoc(doc(db, nomeCollezione, String(id)), senzaId);
      };

      // fsDeleteDoc: elimina un documento dalla collezione.
      window.fsDeleteDoc = function (nomeCollezione, id) {
        return deleteDoc(doc(db, nomeCollezione, String(id)));
      };
    </script>
  </head>
  <body>
    <div id="root"></div>
    <div id="print-root"></div>
    <script type="text/babel" data-presets="react" src="app.js"></script>
    <script>
      function segnalaAggiornamento(registration) {
        fetch("version.json", { cache: "no-store" })
          .then((r) => r.json())
          .then((v) => {
            window.dispatchEvent(
              new CustomEvent("sw-update-available", { detail: { registration, newVersion: v.version } })
            );
          })
          .catch(() => {
            window.dispatchEvent(new CustomEvent("sw-update-available", { detail: { registration, newVersion: null } }));
          });
      }

      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker
            .register("sw.js")
            .then((registration) => {
              // Se c'è già un worker in attesa al momento della registrazione
              if (registration.waiting) {
                segnalaAggiornamento(registration);
              }
              // Nuovo worker trovato durante la sessione
              registration.addEventListener("updatefound", () => {
                const nuovo = registration.installing;
                if (!nuovo) return;
                nuovo.addEventListener("statechange", () => {
                  if (nuovo.state === "installed" && navigator.serviceWorker.controller) {
                    segnalaAggiornamento(registration);
                  }
                });
              });
              // Controlla periodicamente se c'è una versione più recente sul server
              setInterval(() => registration.update().catch(() => {}), 5 * 60 * 1000);
              document.addEventListener("visibilitychange", () => {
                if (document.visibilityState === "visible") registration.update().catch(() => {});
              });
            })
            .catch(() => {});

          let ricaricato = false;
          navigator.serviceWorker.addEventListener("controllerchange", () => {
            if (ricaricato) return;
            ricaricato = true;
            window.location.reload();
          });
        });
      }
    </script>
  </body>
</html>
