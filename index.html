<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Rosa Squadra</title>
    <meta name="description" content="Gestione anagrafica, allenamenti, partite e report della squadra" />
    <link rel="manifest" href="manifest.json" />
    <link rel="icon" href="icon-192.png" type="image/png" />
    <link rel="apple-touch-icon" href="icon-192.png" />
    <meta name="theme-color" content="#1B4332" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Rosa Squadra" />

    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.24.7/babel.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <div id="print-root"></div>
    <script type="text/babel" data-presets="react" src="app.js"></script>
    <script>
      function segnalaAggiornamento(registration) {
        fetch("version.json", { cache: "no-store" })
          .then((r) => r.json())
          .then((v) => {
            window.dispatchEvent(
              new CustomEvent("sw-update-available", { detail: { registration, newVersion: v.version } })
            );
          })
          .catch(() => {
            window.dispatchEvent(new CustomEvent("sw-update-available", { detail: { registration, newVersion: null } }));
          });
      }

      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker
            .register("sw.js")
            .then((registration) => {
              // Se c'è già un worker in attesa al momento della registrazione
              if (registration.waiting) {
                segnalaAggiornamento(registration);
              }
              // Nuovo worker trovato durante la sessione
              registration.addEventListener("updatefound", () => {
                const nuovo = registration.installing;
                if (!nuovo) return;
                nuovo.addEventListener("statechange", () => {
                  if (nuovo.state === "installed" && navigator.serviceWorker.controller) {
                    segnalaAggiornamento(registration);
                  }
                });
              });
              // Controlla periodicamente se c'è una versione più recente sul server
              setInterval(() => registration.update().catch(() => {}), 5 * 60 * 1000);
              document.addEventListener("visibilitychange", () => {
                if (document.visibilityState === "visible") registration.update().catch(() => {});
              });
            })
            .catch(() => {});

          let ricaricato = false;
          navigator.serviceWorker.addEventListener("controllerchange", () => {
            if (ricaricato) return;
            ricaricato = true;
            window.location.reload();
          });
        });
      }
    </script>
  </body>
</html>
